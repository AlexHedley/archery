<!-- https://codepen.io/GGalizzi/pen/PogggB -->
<div id="lastScore">{{ lastScore }}</div>

<div class="target-container" score="M">
    <!-- wa (World Archery) target -->
    <div class="wa" score="1">
        <!-- 1 -->
        <div class="wa" score="2">
            <!-- 2 -->
            <div class="wa black" score="3">
                <!-- 3 -->
                <div class="wa black" score="4">
                    <!-- 4 -->
                    <div class="wa blue" score="5">
                        <!-- 5 -->
                        <div class="wa blue" score="6">
                            <!-- 6 -->
                            <div class="wa red" score="7">
                                <!-- 7 -->
                                <div class="wa red" score="8">
                                    <!-- 8 -->
                                    <div class="wa yellow" score="9">
                                        <!-- 9 -->
                                        <div class="wa yellow ten-ring" score="10">
                                            <!-- 10 -->
                                            <div class="wa yellow x-ring" score="X"><!-- X --></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="mt-3">
    <button ng-click="clearShots()" class="btn btn-secondary btn-sm mb-2">Clear</button>
    <table class="table table-bordered table-sm" ng-if="shots.length > 0">
        <thead>
            <tr>
                <th>#</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="shot in shots track by $index">
                <td>{{ $index + 1 }}</td>
                <td>{{ shot.score }}</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total</th>
                <th>{{ total() }}</th>
            </tr>
        </tfoot>
    </table>
</div>

<div class="mt-4" ng-if="shots.length > 0">
    <h5>History</h5>
    <target-readonly shots="shots"></target-readonly>
</div>
